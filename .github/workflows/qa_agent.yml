name: QA Agent

on:
  # No schedule — this job's two full Gemini agent passes (main + verifier)
  # drove a 243% Gemini API cost jump in Aug 1-13 billing vs. the prior
  # period (2026-08-14). Trigger manually via workflow_dispatch instead.
  workflow_dispatch: # Allow manual triggering

jobs:
  run-qa-agent:
    runs-on: ubuntu-latest
    permissions:
      # read-only: the agent runs with policy.allow_all(), i.e. unrestricted
      # shell on this runner. A `contents: write` token here is a token it can
      # read out of .git/config and push to master with — well beyond the
      # frontend/e2e/ paths the old commit step limited itself to.
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Do not leave a usable credential in .git/config for the agent to find.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies & Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install --no-deps -r requirements-2ddoc.txt

      - name: Run QA Agent
        id: qa_agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_QA || secrets.GEMINI_API_KEY }}
          # gemini-2.5-flash was retired by Google (404 NOT_FOUND as of 2026-08-31).
          # GEMINI_MODEL/GEMINI_FALLBACK_MODEL/GEMINI_EXTRA_FALLBACK_MODELS are tried
          # in order (qa_agent.py: _gemini_model_candidates) — bump this one env var
          # the moment Google retires gemini-3.6-flash too, no code change needed.
          GEMINI_MODEL: "gemini-3.6-flash"
          GEMINI_FALLBACK_MODEL: "gemini-2.5-flash"
          ENABLE_VERIFIER: "false"
          # This agent tests the LIVE production deployment, because that is the
          # only thing that exists: this workflow boots no local server or DB,
          # and render.yaml defines exactly two services, both on master against
          # one database. There is no staging URL to point this at. The prompt
          # is therefore scoped read-only — no accounts, uploads, listings,
          # leases or emails. Widening it needs a staging deploy first.
          QA_TARGET_URL: "https://roomivo.eu"
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          QA_REPORT_EMAIL: ${{ secrets.QA_REPORT_EMAIL || 'contact@roomivo.eu' }}
          FROM_EMAIL: "Roomivo QA <contact@roomivo.eu>"
        # Run from repo root, not backend/ — the agent's workspace scope is its
        # cwd, and it needs write access to frontend/e2e/ (new specs) as well as
        # backend/. Running from backend/ caused every frontend/e2e file-tool
        # call to be denied by the SDK's workspace_only policy (visible in run
        # logs as repeated "Denied by policy 'workspace_only'" before any real
        # work happened).
        run: python backend/scripts/qa_agent.py

      # The auto-commit step was removed deliberately. Its comment claimed the
      # push was gated on the independent verifier, but ENABLE_VERIFIER is
      # "false" above, so `verified` came from qa_agent.py's substring scan of
      # the agent's *own* report for "CRITICAL"/"FAILED". A clean-looking
      # self-report therefore pushed agent-written specs straight to master
      # with [skip ci] and no review — and those specs now target production,
      # so a bad one would re-run against the live site on every future pass.
      #
      # New specs are reported as proposals instead (see the prompt's HOW TO
      # RUN section); a human opens the PR. Restoring an auto-commit needs a
      # real gate: ENABLE_VERIFIER=true AND the verifier's verdict, pushing to
      # a branch rather than master.
      - name: Report spec proposals
        if: always()
        run: |
          echo "New/changed specs are proposals only — this job has no repo write access."
          git status --porcelain frontend/e2e/ || true
