name: QA Agent

on:
  schedule:
    # Run at 20:00 (8:00 PM) every weekday (Monday-Friday)
    - cron: '0 20 * * 1-5'
  workflow_dispatch: # Allow manual triggering

jobs:
  run-qa-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push new tests to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies & Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install --no-deps -r requirements-2ddoc.txt

      - name: Run QA Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          QA_REPORT_EMAIL: ${{ secrets.QA_REPORT_EMAIL || 'contact@roomivo.eu' }}
          FROM_EMAIL: "Roomivo QA <contact@roomivo.eu>"
        working-directory: backend
        run: python scripts/qa_agent.py

      - name: Commit and Push New Tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/
          
          if git diff --staged --quiet; then
            echo "No new tests created."
          else
            git commit -m "test: add automated playwright specs generated by QA Agent [skip ci]"
            git push
          fi
